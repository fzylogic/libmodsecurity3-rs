# cargo-release configuration — https://github.com/crate-ci/cargo-release
#
# Driven by the `release` job in .github/workflows/ci.yml, which runs only on a
# manual dispatch and only once every test job has passed. Everything here is
# spelled out rather than left to cargo-release's defaults, so that what a
# release does is readable without consulting its changelog.

# Releases are cut from main and nowhere else. Dispatching the workflow on
# another branch is refused here rather than part-way through.
allow-branch = ["main"]

# Bump the version, commit, tag, push the commit and the tag, publish to
# crates.io. Set `publish = false` to tag without publishing.
publish = true
push = true
tag = true

# The runner has no signing key.
sign-commit = false
sign-tag = false

tag-name = "v{{version}}"
tag-message = "{{crate_name}} {{version}}"
pre-release-commit-message = "Release {{crate_name}} {{version}}"
